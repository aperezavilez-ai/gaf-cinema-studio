[workspace]
members = ["engine"]
resolver = "2"

[workspace.package]
version = "1.0.0"
edition = "2021"
license = "Proprietary"
authors = ["CinemaStudio"]

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
thiserror = "2"
rusqlite = { version = "0.32", features = ["bundled"] }
sha2 = "0.10"
mime_guess = "2"
