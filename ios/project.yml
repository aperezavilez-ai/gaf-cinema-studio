name: CinemaStudio
options:
  bundleIdPrefix: com.cinemastudio
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "15.0"
  generateEmptyDirectories: true

settings:
  base:
    SWIFT_VERSION: "5.9"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_STYLE: Automatic

targets:
  CinemaStudio:
    type: application
    platform: iOS
    sources:
      - path: CinemaStudio
        excludes:
          - "**/.DS_Store"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.cinemastudio.app
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_NSCameraUsageDescription: "Import video for your cinematic projects."
        INFOPLIST_KEY_NSPhotoLibraryUsageDescription: "Import video into your cinematic projects."
        SWIFT_ACTIVE_COMPILATION_CONDITIONS: $(inherited)
        # Add CINEMASTUDIO_ENGINE_LINKED when XCFramework is linked:
        # SWIFT_ACTIVE_COMPILATION_CONDITIONS: $(inherited) CINEMASTUDIO_ENGINE_LINKED
        INFOPLIST_KEY_UISupportsDocumentBrowser: YES
        TARGETED_DEVICE_FAMILY: "1,2"
        OTHER_LDFLAGS: ["-framework AVFoundation", "-framework ImageIO"]
    dependencies: []
    # Link Rust static lib when built for iOS:
    #   LIBRARY_SEARCH_PATHS: $(PROJECT_DIR)/Generated
    #   OTHER_LDFLAGS: -lcinemastudio_engine

schemes:
  CinemaStudio:
    build:
      targets:
        CinemaStudio: all
    run:
      config: Debug
    test:
      config: Debug
